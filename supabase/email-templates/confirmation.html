<!doctype html>
<html lang="ja">
  <body style="margin:0;background:#f5f6f8;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:#111827;">
    <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="padding:32px 16px;background:#f5f6f8;">
      <tr>
        <td align="center">
          <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="max-width:560px;background:#ffffff;border-radius:18px;padding:32px;">
            <tr>
              <td>
                <div style="font-size:22px;font-weight:800;letter-spacing:.02em;">Talentify</div>
                <h1 style="font-size:24px;line-height:1.5;margin:28px 0 12px;">メールアドレスをご確認ください</h1>
                <p style="font-size:15px;line-height:1.8;color:#4b5563;margin:0 0 24px;">
                  Talentifyへのご登録ありがとうございます。下のボタンからメールアドレスを確認すると、アカウント登録が完了します。
                </p>
                <p style="margin:0 0 28px;">
                  <a href="{{ .ConfirmationURL }}" style="display:inline-block;background:#2563eb;color:#ffffff;text-decoration:none;font-weight:700;padding:12px 22px;border-radius:10px;">
                    メールアドレスを確認する
                  </a>
                </p>
                <p style="font-size:12px;line-height:1.7;color:#9ca3af;margin:0;">
                  このメールに心当たりがない場合は、そのまま破棄してください。
                </p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
