<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="1754" viewBox="0 0 1240 1754">
<defs>
  <linearGradient id="topShade" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#03050a" stop-opacity=".88"/>
    <stop offset=".62" stop-color="#03050a" stop-opacity=".18"/>
    <stop offset="1" stop-color="#03050a" stop-opacity="0"/>
  </linearGradient>
  <linearGradient id="bottomShade" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#05070d" stop-opacity="0"/>
    <stop offset=".34" stop-color="#05070d" stop-opacity=".48"/>
    <stop offset=".72" stop-color="#05070d" stop-opacity=".93"/>
    <stop offset="1" stop-color="#020307"/>
  </linearGradient>
  <linearGradient id="streak" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#ff2f18" stop-opacity="0"/>
    <stop offset=".20" stop-color="#ff2f18"/>
    <stop offset=".65" stop-color="#ff8400"/>
    <stop offset="1" stop-color="#ffc400" stop-opacity="0"/>
  </linearGradient>
  <filter id="glow"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<rect width="1240" height="350" fill="url(#topShade)"/>
<rect y="790" width="1240" height="964" fill="url(#bottomShade)"/>

<!-- high energy foreground streaks -->
