<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="1754" viewBox="0 0 1240 1754">
<defs>
  <linearGradient id="base" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#07080d"/>
    <stop offset=".44" stop-color="#13080a"/>
    <stop offset=".72" stop-color="#081426"/>
    <stop offset="1" stop-color="#03050a"/>
  </linearGradient>
  <radialGradient id="r1" cx="20%" cy="18%" r="62%">
    <stop offset="0" stop-color="#ff2d16" stop-opacity=".92"/>
    <stop offset=".32" stop-color="#ff4b17" stop-opacity=".30"/>
    <stop offset="1" stop-color="#ff2d16" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="r2" cx="78%" cy="12%" r="58%">
    <stop offset="0" stop-color="#ffc400" stop-opacity=".64"/>
    <stop offset=".28" stop-color="#ff7a00" stop-opacity=".22"/>
    <stop offset="1" stop-color="#ffc400" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="r3" cx="84%" cy="60%" r="48%">
    <stop offset="0" stop-color="#1467d8" stop-opacity=".34"/>
    <stop offset="1" stop-color="#1467d8" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="warmLine" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#ff3018" stop-opacity="0"/>
    <stop offset=".22" stop-color="#ff3018"/>
    <stop offset=".72" stop-color="#ff9900"/>
    <stop offset="1" stop-color="#ffc400" stop-opacity="0"/>
  </linearGradient>
  <linearGradient id="goldLine" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#ffc400" stop-opacity="0"/>
    <stop offset=".5" stop-color="#fff0a0"/>
    <stop offset="1" stop-color="#ffc400" stop-opacity="0"/>
  </linearGradient>
  <filter id="blur20"><feGaussianBlur stdDeviation="20"/></filter>
  <filter id="blur8"><feGaussianBlur stdDeviation="8"/></filter>
  <filter id="glow"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <filter id="noise"><feTurbulence type="fractalNoise" baseFrequency=".78" numOctaves="3" seed="9"/><feColorMatrix type="saturate" values="0"/><feComponentTransfer><feFuncA type="table" tableValues="0 .08"/></feComponentTransfer></filter>
  <pattern id="grid" width="62" height="62" patternUnits="userSpaceOnUse">
    <path d="M62 0H0V62" fill="none" stroke="#fff" stroke-opacity=".026"/>
  </pattern>
</defs>
<rect width="1240" height="1754" fill="url(#base)"/>
<rect width="1240" height="1754" fill="url(#r1)"/>
<rect width="1240" height="1754" fill="url(#r2)"/>
<rect width="1240" height="1754" fill="url(#r3)"/>
<rect width="1240" height="1754" fill="url(#grid)"/>
<rect width="1240" height="1754" filter="url(#noise)" opacity=".35"/>

<!-- stage truss -->
<g stroke="#ffb000" stroke-opacity=".16" stroke-width="5">
  <path d="M-40 155L560 18"/><path d="M680 20L1280 180"/>
  <path d="M-30 235L610 92"/><path d="M620 92L1270 245"/>
</g>
<g stroke="#fff" stroke-opacity=".08" stroke-width="2">
  <path d="M20 135L210 205L400 92L585 165"/>
  <path d="M670 155L845 70L1030 205L1210 118"/>
</g>

<!-- spotlights -->
<g filter="url(#blur20)" opacity=".72">
  <path d="M40 60L430 1030L570 1030L150 45Z" fill="#ff3a18" opacity=".18"/>
  <path d="M1180 20L720 1120L850 1140L1230 95Z" fill="#1f83ff" opacity=".14"/>
  <path d="M970 0L500 930L610 950L1085 12Z" fill="#ffc400" opacity=".12"/>
</g>

<!-- diagonal streaks -->
<g filter="url(#glow)">
  <path d="M-80 570L1290 265" stroke="url(#warmLine)" stroke-width="8" opacity=".74"/>
  <path d="M-80 606L1270 310" stroke="#ff3b22" stroke-width="2" opacity=".75"/>
  <path d="M-100 1090L1290 760" stroke="url(#warmLine)" stroke-width="12" opacity=".88"/>
  <path d="M-40 1160L1180 890" stroke="#ffcf41" stroke-width="3" opacity=".62"/>
  <path d="M40 1260L1160 1030" stroke="#2e9bff" stroke-width="3" opacity=".40"/>
</g>

<!-- flare dots -->
<g filter="url(#glow)">
  <circle cx="112" cy="122" r="12" fill="#fff7d8"/>
  <circle cx="325" cy="65" r="8" fill="#ff7b19"/>
  <circle cx="1040" cy="122" r="13" fill="#fff8d2"/>
  <circle cx="1150" cy="355" r="7" fill="#ffc400"/>
  <circle cx="125" cy="735" r="8" fill="#ff5a1f"/>
  <circle cx="1015" cy="805" r="7" fill="#ffc400"/>
  <circle cx="880" cy="1015" r="6" fill="#fff"/>
  <circle cx="240" cy="1110" r="5" fill="#ffc400"/>
</g>
<g fill="#ffc400" opacity=".62">
  <circle cx="185" cy="355" r="3"/><circle cx="245" cy="405" r="2"/><circle cx="1060" cy="505" r="3"/>
  <circle cx="1105" cy="650" r="2"/><circle cx="865" cy="690" r="3"/><circle cx="380" cy="875" r="2"/>
  <circle cx="970" cy="1110" r="3"/><circle cx="185" cy="1185" r="3"/>
</g>

<!-- photo stage behind subject -->
<path d="M350 180C580 70 940 95 1140 290V1260C900 1340 530 1310 315 1170Z" fill="#05070d" opacity=".25"/>
<ellipse cx="760" cy="610" rx="420" ry="510" fill="#ff431b" opacity=".08" filter="url(#blur20)"/>
<ellipse cx="890" cy="520" rx="300" ry="390" fill="#ffc400" opacity=".06" filter="url(#blur20)"/>

<!-- dark read zones -->
<path d="M34 72H510L455 370H34Z" fill="#05060a" opacity=".63"/>
<path d="M40 1035L850 925L830 1288L40 1335Z" fill="#07080d" opacity=".34"/>
<path d="M72 1390H1168L1118 1568H72Z" fill="#05060a" opacity=".72"/>
</svg>