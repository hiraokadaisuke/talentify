    <radialGradient id="gold" cx="88%" cy="12%" r="58%">
      <stop offset="0" stop-color="#FFC400" stop-opacity=".55"/>
      <stop offset=".32" stop-color="#FFC400" stop-opacity=".12"/>
      <stop offset="1" stop-color="#FFC400" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blue" cx="90%" cy="56%" r="55%">
      <stop offset="0" stop-color="#2F80ED" stop-opacity=".45"/>
      <stop offset=".44" stop-color="#2F80ED" stop-opacity=".10"/>
      <stop offset="1" stop-color="#2F80ED" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="beamWarm" x1="0" y1="0" x2="1" y2="0">
