<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="1754" viewBox="0 0 1240 1754">
  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050B15"/>
      <stop offset="0.42" stop-color="#081426"/>
      <stop offset="0.72" stop-color="#0B1F3B"/>
      <stop offset="1" stop-color="#05070D"/>
    </linearGradient>
    <radialGradient id="warm" cx="18%" cy="18%" r="62%">
      <stop offset="0" stop-color="#FF5A1F" stop-opacity=".72"/>
